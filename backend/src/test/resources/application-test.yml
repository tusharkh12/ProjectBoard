spring:
  # Test database configuration - uses MySQL test database
  datasource:
    url: jdbc:mysql://localhost:3306/projectboard_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  
  # JPA/Hibernate configuration for tests
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  
  # Disable data.sql loading in tests
  sql:
    init:
      mode: never  # This prevents data.sql from being loaded during tests

# Logging configuration for tests
logging:
  level:
    com.projectboard: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE