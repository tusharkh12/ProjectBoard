server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ProjectBoard Backend
    
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/projectboard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
        
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    format-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        connection:
          isolation: 2  # READ_COMMITTED isolation level
        
  # SQL Script Initialization
  # Set to 'never' to prevent re-insertion on every restart
  sql:
    init:
      mode: never
      data-locations: classpath:data.sql
      
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    
  # Validation Configuration
  validation:
    enabled: true

# Logging Configuration
logging:
  level:
    com.projectboard: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      
# Custom Application Properties
projectboard:
  version: 1.0.0
  description: "ProjectBoard - Collaborative Task Management with Conflict Resolution"
  features:
    optimistic-locking: true
    conflict-resolution: true
    real-time-updates: true

app:
  cors:
    origins: http://localhost:4200

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS512Algorithm}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds